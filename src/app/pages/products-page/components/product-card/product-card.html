<a [routerLink]="['/']">
  <img src="product.jpg" alt="A product image" />
  <div class="content">
    <h3>{{ product().name }}</h3>
    <p [class.inactive]="!product().isActive">
      {{ product().isActive ? 'In stock' : 'Out of stock' }}
    </p>
    <span>{{ product().price | currency }}</span>
    <button appButton variant="primary" (click)="addToCard($event)" class="add-to-cart-btn">
      Add to cart
    </button>
  </div>
</a>
