@if(isLoading()){
<div class="spinner-wrapper">
  <app-spinner size="medium" />
</div>
}@else {
<ul>
  @for(product of products(); track product.id){
  <app-product-card [product]="product" />
  }
</ul>
}
<div class="pagination-wrapper">
  <app-pagination
    [currentPage]="currentPage()"
    [isLoading]="isLoading()"
    (prev)="prevPage()"
    (next)="nextPage()"
  />
</div>
