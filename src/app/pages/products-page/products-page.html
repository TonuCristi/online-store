@if(isLoading()){
<div class="spinner-wrapper">
  <app-spinner size="big" />
</div>
} @else {
<div class="catalog">
  <div class="products-filters-wrapper">
    <app-products-filters />
  </div>
  <h1>{{ category()?.name }}</h1>
  <select appSelect size="full" [options]="options" (onChange)="sortData($event)"></select>
  <div class="products-list-wrapper">
    <app-products-list [products]="products()" [isProductsLoading]="isProductsLoading()" />
  </div>
  <div class="pagination-wrapper">
    <app-pagination
      [currentPage]="currentPage()"
      [totalPages]="totalPages()"
      [isProductsLoading]="isProductsLoading()"
      (prev)="loadPrevPage()"
      (next)="loadNextPage()"
    />
  </div>
</div>
}
