<button appButton variant="primary" [disabled]="isProductsLoading()" (click)="prevPage()">
  Prev
</button>
@if(currentPage() > 2) {
<button appButton class="page-btn">
  {{ 1 }}
</button>
} @for(page of pages();track page){ @if(page < 3){
<button appButton class="page-btn" [class.active]="currentPage() === page">
  {{ page + 1 }}
</button>
} }
<span>...</span>
<button appButton class="page-btn">
  {{ totalPages() }}
</button>
