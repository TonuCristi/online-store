<div class="accordion">
  <header (click)="openAccordion()">
    <h3>{{ title() }}</h3>
    @if(isOpen()){
    <span>⬇️</span>
    }@else {
    <span>⬆️</span>
    }
  </header>
  @if(isOpen()) {
  <div class="content" appClickOutside (onClickOutside)="closeAccordion()">
    <ng-content />
  </div>
  }
</div>
